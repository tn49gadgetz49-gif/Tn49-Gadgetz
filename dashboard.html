<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TN49 Gadgetz Admin Dashboard</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    background:#FFD700;
    color:#000;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#222;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:none;
    font-size:16px;
}

button{
    background:#FFD700;
    font-weight:bold;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #555;
    padding:10px;
    text-align:center;
}

th{
    background:#FFD700;
    color:#000;
}
</style>
</head>

<body>

<header>
TN49 Gadgetz Admin Panel
</header>

<div class="container">

<div class="card">
<h2>Select Next Prize</h2>

<select id="prize">
<option>Bluetooth Neckband</option>
<option>USB Charging Cable</option>
<option>Tempered Glass</option>
<option>Mobile Stand</option>
<option>Wireless Earbuds</option>
<option>Better Luck Next Time</option>
</select>

<button id="savePrizeBtn">Save Prize</button>
</div>

<div class="card">
<h2>Winner History</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Mobile</th>
<th>Prize</th>
</tr>
</thead>

<tbody id="history">
</tbody>

</table>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
