<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TN49 Gadgetz Lucky Spin</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🎡 TN49 Gadgetz Lucky Spin</h1>

    <input
        type="text"
        id="customerName"
        placeholder="Enter Your Name">

    <input
        type="tel"
        id="customerMobile"
        placeholder="Enter Mobile Number"
        maxlength="10">

    <div class="wheel-container">

        <div id="wheel" class="wheel">

            <div class="center-circle">
                SPIN
            </div>

        </div>

    </div>

    <button id="spinBtn">
        SPIN NOW
    </button>

    <div id="result"></div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
